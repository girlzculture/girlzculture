[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Keep native media on Node 22 until a Node 24 function deploy has passed the
  # same cold-start and pixel checks as production.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify's secret scanner was matching secret values inside generated
  # Turbopack cache blobs under .netlify/.next/cache, not in source files.
  # The same generated cache is safe to omit from scanning while source/build
  # output remains scanned normally.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/turbopack/**"

[functions."booking-reminders"]
  schedule = "*/15 * * * *"

[functions."media-cleanup"]
  schedule = "15 4 * * *"

[functions."pickup-reservation-cleanup"]
  schedule = "*/15 * * * *"

# Founder requires this review branch to remain undeployed. A branch context
# overrides both branch deploys and PR previews without changing main or other
# branches. The failing command also stops a build-hook attempt that ignores
# the normal ignore check. Remove only after separate deployment approval.
[context."codex/p0-multilingual-business-os-assistant"]
  ignore = "exit 0"
  command = "node -e \"console.error('P0 review branch is intentionally undeployed'); process.exit(1)\""
