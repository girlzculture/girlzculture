name: Apply admin manual booking wizard

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-admin-manual-booking-wizard.mjs"
      - ".github/workflows/apply-admin-manual-booking-wizard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-admin-manual-booking-wizard.mjs
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No manual-booking wiring changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminRecordWorkspace.tsx
          git diff --cached --check
          git commit -m "feat: wire complete admin manual booking wizard"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections