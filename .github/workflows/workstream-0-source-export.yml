name: Export Workstream 0 audit source snapshot

on:
  push:
    branches:
      - audit/workstream-0-current-state
    paths:
      - ".github/workflows/workstream-0-source-export.yml"

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build tracked text-source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/girlzculture-source
          git ls-files -z | while IFS= read -r -d '' file; do
            case "$file" in
              .tools/*|*.zip|*.png|*.jpg|*.jpeg|*.gif|*.webp|*.ico|*.woff|*.woff2|*.ttf|*.eot|*.mp4|*.mov|*.pdf|package-lock.json)
                continue
                ;;
            esac
            if [ -f "$file" ]; then
              mkdir -p "/tmp/girlzculture-source/$(dirname "$file")"
              cp "$file" "/tmp/girlzculture-source/$file"
            fi
          done
          tar -C /tmp/girlzculture-source -czf /tmp/girlzculture-source.tar.gz .
          sha256sum /tmp/girlzculture-source.tar.gz > /tmp/girlzculture-source.sha256
          printf '%s\n' "${GITHUB_SHA}" > /tmp/girlzculture-source.commit

      - uses: actions/upload-artifact@v4
        with:
          name: workstream-0-source-snapshot
          path: |
            /tmp/girlzculture-source.tar.gz
            /tmp/girlzculture-source.sha256
            /tmp/girlzculture-source.commit
          if-no-files-found: error
          retention-days: 1
