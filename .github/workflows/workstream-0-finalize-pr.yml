name: Finalize Workstream 0 hardened audit PR

on:
  push:
    branches:
      - audit/workstream-0-current-state
    paths:
      - ".github/workflows/workstream-0-finalize-pr.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate hardened matrix and prepare PR body
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections, csv, json
          from pathlib import Path

          root=Path('docs/audits/workstream-0')
          matrix=root/'FEATURE_GAP_MATRIX.csv'
          required=['Requirement_ID','Workstream','Requirement','Affected_User_or_Surface','Classification','Current_Behavior','Evidence','Relevant_Files','Relevant_Routes','Relevant_Database_Objects','Relevant_Services_or_Endpoints','Relevant_Jobs_or_Events','Relevant_Tests','Missing_Layers','Security_Privacy_Financial_or_Legal_Risk','Human_Decision_or_Approval_Required','External_Dependency','Recommended_Next_Action','Suggested_Implementation_Phase','Confidence','Verification_Method']
          allowed=['Complete and correct','Complete but weak','Partially implemented','Decorative or mocked','Duplicated','Missing','Unsafe']
          with matrix.open(newline='',encoding='utf-8-sig') as f:
              reader=csv.DictReader(f); rows=list(reader); fields=reader.fieldnames
          assert fields==required, fields
          assert len(rows)==620, len(rows)
          assert len({r['Requirement_ID'] for r in rows})==620
          assert not any(not str(r.get(c,'')).strip() for r in rows for c in required)
          assert set(r['Classification'] for r in rows)<=set(allowed)
          assert len({r['Current_Behavior'] for r in rows})==620
          assert len({r['Evidence'] for r in rows})==620
          assert len({r['Verification_Method'] for r in rows})==620
          assert not any('docs/audits/workstream-0/' in (r['Evidence']+r['Relevant_Files']) for r in rows)
          assert not any(r['Classification']=='Complete and correct' and r['Relevant_Tests'].startswith('No direct') for r in rows)
          assert not any(r['Classification']=='Missing' and 'Negative evidence:' not in r['Evidence'] for r in rows)
          assert not any(r['Classification']=='Unsafe' and 'Risk evidence:' not in r['Evidence'] for r in rows)
          current=(root/'CURRENT_STATE_AUDIT.md').read_text(encoding='utf-8')
          assert '## Evidence-integrity hardening — 2026-08-28' in current
          counts=collections.Counter(r['Classification'] for r in rows)
          table='\n'.join(f'| {name} | {counts[name]} |' for name in allowed)
          body=f'''## Scope

Read-only **Workstream 0 — Current-State Product and Codebase Audit** against the complete Girlz Culture Product, Operations, Engineering, and Growth Requirements Handoff.

This PR documents the current product and codebase. It does **not** begin Workstream 1, remediate findings, alter business rules, deploy product behavior, or mutate production data.

## Baseline

- Repository: `girlzculture/girlzculture`
- Base branch: `main`
- Application baseline: `52af829ae8934a6607c32e1372c55d9f846d2d1b`
- Audit branch: `audit/workstream-0-current-state`
- Final hardened audit head: `__FINAL_SHA__`

## Deliverables

- `docs/audits/workstream-0/CURRENT_STATE_AUDIT.md`
- `docs/audits/workstream-0/FEATURE_GAP_MATRIX.csv`
- `docs/audits/workstream-0/SYSTEM_INVENTORY.md`
- `docs/audits/workstream-0/KNOWN_RISKS.md`
- `docs/audits/workstream-0/IMPLEMENTATION_DEPENDENCIES.md`
- `docs/audits/workstream-0/TEST_ENVIRONMENT_SETUP.md`

The matrix contains **620 independently testable requirements**, all 21 required columns, unique requirement IDs, and the seven approved classifications.

## Evidence-integrity correction

A second pass was performed after review found that parts of the first matrix reused broad workstream references or machine-selected files/tests that did not directly establish the exact requirement.

The hardened matrix now enforces these gates:

1. Every row has a stable unique `Requirement_ID` carried through behavior, evidence, action, and verification text.
2. Positive claims cite existing implementation paths and direct line excerpts.
3. `Complete and correct` requires a directly relevant named verifier or browser test.
4. Positive implementation evidence must pass a two-term semantic relevance gate.
5. `Missing` rows contain explicit negative search evidence and label adjacent files as related only.
6. `Unsafe` rows contain a traceable risk basis.
7. Routes and database objects are derived from real App Router paths and code/SQL declarations.
8. Audit documents cannot cite themselves as product evidence.
9. The final PR diff contains only the six audit deliverables.

## Recalibrated classification totals

| Classification | Count |
|---|---:|
{table}
| **Total** | **{len(rows)}** |

These totals are not a percentage-complete score. Compound requirements were split into independently testable rows, and the correction deliberately downgraded claims where a page, table, route, or neighboring test did not prove the whole requirement.

## Highest-priority findings

1. The appointment-deposit implementation does not match the required 30-minute authorization-only grace-period model.
2. Destination-transfer and later Admin payout/transfer paths overlap; one authoritative salon-funds architecture is required.
3. Product-commerce mechanics exist while merchant-of-record, sales-tax, shipping, returns, chargebacks, seller responsibility, and refund ownership remain unresolved.
4. Subscription names, prices, entitlements, and Stripe environment-variable contracts are inconsistent.
5. `main` is the production branch but is not protected by required checks.
6. No authoritative isolated provider-backed staging environment was verified.
7. Notification configuration includes a Twilio variable-name mismatch.
8. Domain actions remain fragmented across feature-specific audit/event tables rather than one versioned event contract.
9. Policy acceptance, appeals, salon strikes, and the complete customer-protection enforcement lifecycle are incomplete.
10. Real-provider acceptance remains incomplete for critical Stripe Connect, Google Maps, email, SMS, and recovery workflows.

## Validation

The hardened audit asserts:

- 620 rows and 21 exact columns;
- 620 unique requirement IDs;
- no blank required cells;
- exact classification vocabulary;
- unique behavior, evidence, and verification narratives;
- no audit self-citation;
- direct tests for every `Complete and correct` row;
- negative evidence for every `Missing` row;
- risk evidence for every `Unsafe` row;
- existence checks for cited files and tests;
- final six-file-only PR diff.

Repository CI should still be reviewed on this final head. Passing repository tests validate the unchanged application baseline and audit-file structure; they do not convert fixture tests into real-provider proof.

## Known limitations

- The correction uses the immutable application baseline and a read-only tracked-source snapshot; it does not inspect a developer’s uncommitted local files.
- No secret values were read.
- No real customer, salon, payment, refund, transfer, notification, map, or production record was created or changed.
- Historical completion reports were treated as dated evidence, not current proof.
- Financial, legal, privacy, accessibility, tax, translation, and launch-readiness judgments still require qualified human review.

## Safety confirmation

No product behavior, application code, dependency, migration, runtime setting, Netlify setting, production database, booking, notification, payment, refund, payout, or customer/salon record was intentionally changed.

**Draft for founder and domain-owner review. Do not merge merely because automated checks pass. Workstream 0 stops here.**
'''
          Path('/tmp/pr-body.md').write_text(body,encoding='utf-8')
          Path('/tmp/counts.json').write_text(json.dumps({'rows':len(rows),'counts':dict(counts)},sort_keys=True),encoding='utf-8')
          print(json.dumps({'rows':len(rows),'counts':dict(counts)},indent=2,sort_keys=True))
          PY

      - name: Remove temporary audit tooling and create final documentation-only commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/workstream-0-source-export.yml
          rm -f .github/workflows/workstream-0-harden-audit.yml
          rm -f .github/workflows/workstream-0-finalize-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected=$(printf '%s\n' \
            docs/audits/workstream-0/CURRENT_STATE_AUDIT.md \
            docs/audits/workstream-0/FEATURE_GAP_MATRIX.csv \
            docs/audits/workstream-0/IMPLEMENTATION_DEPENDENCIES.md \
            docs/audits/workstream-0/KNOWN_RISKS.md \
            docs/audits/workstream-0/SYSTEM_INVENTORY.md \
            docs/audits/workstream-0/TEST_ENVIRONMENT_SETUP.md)
          actual=$(git diff --name-only origin/main -- | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final PR paths:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m "docs: finalize hardened Workstream 0 audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Synchronize Draft PR description and reviewer note
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/__FINAL_SHA__/${FINAL_SHA}/g" /tmp/pr-body.md
          gh pr edit 49 --repo "$GITHUB_REPOSITORY" --body-file /tmp/pr-body.md
          counts=$(cat /tmp/counts.json)
          gh pr comment 49 --repo "$GITHUB_REPOSITORY" --body "<!-- workstream-0-evidence-hardening -->
          Evidence-integrity hardening completed on \`${FINAL_SHA}\`.

          - The 620-row matrix was regenerated against the immutable application baseline.
          - Positive rows now require direct, semantically relevant implementation evidence.
          - Complete rows require direct named tests.
          - Missing and unsafe rows require explicit negative/risk evidence.
          - Every cited path was existence-checked.
          - Temporary audit workflows were removed; the final diff is limited to the six audit documents.
          - Classification summary: \`${counts}\`.

          PR #49 remains Draft. Workstream 1 and remediation have not begun."
