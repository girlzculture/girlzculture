name: Apply final payout safety fixes

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-final-payout-safety-fixes.mjs"
      - ".github/workflows/apply-final-payout-safety-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-final-payout-safety-fixes.mjs
      - name: Commit generated fixes
        run: |
          if git diff --quiet; then
            echo "No payout safety changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260825150000_stripe_connect_booking_payouts.sql src/app/api/admin/finance/payout/route.ts
          git diff --cached --check
          git commit -m "fix: harden Stripe Connect payout reconciliation"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections