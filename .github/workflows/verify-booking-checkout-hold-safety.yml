name: Verify booking checkout hold safety

on:
  pull_request:
    paths:
      - "src/app/api/admin/bookings/route.ts"
      - "src/app/api/stripe/booking-checkout/route.ts"
      - "src/app/api/stripe/webhook/route.ts"
      - "src/lib/stripeServer.ts"
      - "scripts/verify-booking-checkout-hold-safety.mjs"
      - ".github/workflows/verify-booking-checkout-hold-safety.yml"
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "src/app/api/admin/bookings/route.ts"
      - "src/app/api/stripe/booking-checkout/route.ts"
      - "src/app/api/stripe/webhook/route.ts"
      - "src/lib/stripeServer.ts"
      - "scripts/verify-booking-checkout-hold-safety.mjs"
      - ".github/workflows/verify-booking-checkout-hold-safety.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pull-request builds cannot access protected production secrets. These
      # nonfunctional values only allow Next.js to evaluate the client module.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-booking-checkout-hold-safety.mjs
      - run: npm run verify:migrations
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
