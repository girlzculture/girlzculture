name: Final PR47 cleanup and dispatch

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: final-pr47-cleanup-and-dispatch
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply compatible lockfile resolutions and remove all one-time mutation automation
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only --ignore-scripts || true
          python <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path.cwd()
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          workflow_pattern = re.compile(
              r'^\.github/workflows/(?:apply-|fix-pr47-|fix-booking-|clean-booking-|finalize-booking-|diagnose-pr47-build|apply-monitoring-|finalize-pr47-completion|refine-final-launch-release-candidate-browser|ensure-final-pr47-consolidation|final-pr47-cleanup-and-dispatch)'
          )
          script_pattern = re.compile(
              r'^scripts/(?:apply-|fix-pr47-|fix-booking-|clean-booking-|finalize-booking-|apply-monitoring-|finalize-pr47-completion)'
          )
          templates = {
              'scripts/templates/AdminFeaturedCampaignsV2.tsx.txt',
              'scripts/templates/featured-campaign-route.ts.txt',
          }
          for relative in changed:
              if workflow_pattern.match(relative) or script_pattern.match(relative) or relative in templates:
                  target = root / relative
                  if target.exists():
                      target.unlink()
          for relative in [
              'src/app/api/admin/engine/errors-export/route.ts',
              'docs/PR47_CI_RETRIGGER_2026-08-26.md',
              'docs/PR47_FINAL_RECHECK_2026-08-26.md',
          ]:
              target = root / relative
              if target.exists():
                  target.unlink()
          PY

      - name: Commit the final consolidated dependency graph and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize PR47 cleanup and compatible dependencies"
            git pull --rebase origin agent/final-launch-mobile-realtime-admin-corrections
            git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
          fi

      - name: Dispatch the authoritative release-candidate gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run final-launch-release-candidate-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/final-launch-mobile-realtime-admin-corrections
