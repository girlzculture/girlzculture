name: Repair Workstream 0 audit branch

on:
  push:
    branches:
      - audit/workstream-0-current-state
    paths:
      - ".github/workflows/workstream-0-repair-branch.yml"

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run the existing evidence-hardening generator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/workstream-0-harden-audit.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('Unable to locate the embedded audit-hardening program.')
          payload = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script_lines = []
          for line in payload.splitlines():
              script_lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, 'workstream-0-hardening.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Independently validate the committed-document candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv
          import collections

          matrix = Path('docs/audits/workstream-0/FEATURE_GAP_MATRIX.csv')
          with matrix.open(newline='', encoding='utf-8-sig') as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              columns = reader.fieldnames or []

          required = [
              'Requirement_ID','Workstream','Requirement','Affected_User_or_Surface',
              'Classification','Current_Behavior','Evidence','Relevant_Files',
              'Relevant_Routes','Relevant_Database_Objects',
              'Relevant_Services_or_Endpoints','Relevant_Jobs_or_Events',
              'Relevant_Tests','Missing_Layers',
              'Security_Privacy_Financial_or_Legal_Risk',
              'Human_Decision_or_Approval_Required','External_Dependency',
              'Recommended_Next_Action','Suggested_Implementation_Phase',
              'Confidence','Verification_Method',
          ]
          approved = {
              'Complete and correct','Complete but weak','Partially implemented',
              'Decorative or mocked','Duplicated','Missing','Unsafe',
          }
          forbidden = (
              'src/components/**',
              'major public/salon/admin pages',
              'Some layers exist; workflow not end-to-end.',
              'Real implementation; handoff quality/provider gaps remain.',
              'Playwright; lint',
              'Semantic tokens; contrast/axe sweep',
              'Token/contrast audit',
          )

          assert columns == required, columns
          assert len(rows) == 620, len(rows)
          assert len({row['Requirement_ID'] for row in rows}) == 620
          assert {row['Classification'] for row in rows} <= approved
          for index, row in enumerate(rows, start=2):
              for column in required:
                  assert str(row[column]).strip(), (index, column)
              combined = ' | '.join(str(row[column]) for column in required)
              for phrase in forbidden:
                  assert phrase not in combined, (index, phrase)
              if row['Classification'] == 'Missing':
                  assert 'Negative evidence:' in row['Evidence'], index
              if row['Classification'] == 'Complete and correct':
                  assert not row['Relevant_Tests'].startswith('No direct'), index
                  for item in row['Relevant_Tests'].split(';'):
                      source = item.strip().split(' — ')[0]
                      assert source and Path(source).is_file(), (index, source)
              if row['Classification'] == 'Unsafe':
                  assert 'Risk evidence:' in row['Evidence'], index

          ws1 = [row for row in rows if row['Requirement_ID'].startswith('WS01-')]
          assert len(ws1) >= 16
          assert len({row['Current_Behavior'] for row in ws1[:20]}) == len(ws1[:20])
          assert len({row['Evidence'] for row in ws1[:20]}) == len(ws1[:20])
          counts = collections.Counter(row['Classification'] for row in rows)
          print({'rows': len(rows), 'columns': len(columns), 'classifications': dict(counts)})
          PY

      - name: Remove all temporary workflows and commit only the six audit documents
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/workstream-0-source-export.yml \
            .github/workflows/workstream-0-harden-audit.yml \
            .github/workflows/workstream-0-finalize-pr.yml \
            .github/workflows/workstream-0-repair-branch.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          expected=$(printf '%s\n' \
            docs/audits/workstream-0/CURRENT_STATE_AUDIT.md \
            docs/audits/workstream-0/FEATURE_GAP_MATRIX.csv \
            docs/audits/workstream-0/IMPLEMENTATION_DEPENDENCIES.md \
            docs/audits/workstream-0/KNOWN_RISKS.md \
            docs/audits/workstream-0/SYSTEM_INVENTORY.md \
            docs/audits/workstream-0/TEST_ENVIRONMENT_SETUP.md)
          actual=$(git diff --cached --name-only origin/main -- | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Final PR scope is not exactly the six audit documents." >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi

          git commit -m "docs: harden Workstream 0 row-level evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
