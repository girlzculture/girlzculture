name: Apply monitoring inventory and export hardening

on:
  workflow_dispatch:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-monitoring-inventory-and-export-hardening.mjs"
      - ".github/workflows/apply-monitoring-inventory-and-export-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-monitoring-inventory-and-export-hardening.mjs
      - name: Commit monitoring and export corrections
        run: |
          if git diff --quiet; then
            echo "Monitoring and export corrections are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-operational-monitoring.mjs docs/OPERATIONAL_MONITORING_ROUTE_INVENTORY_2026-07-23.md src/app/api/admin/finance/payout/route.ts src/app/api/admin/engine/errors/route.ts
          git diff --cached --check
          git commit -m "fix: consolidate incident export and monitoring inventory"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
