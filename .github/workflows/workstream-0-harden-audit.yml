name: Harden Workstream 0 audit evidence

on:
  push:
    branches:
      - audit/workstream-0-current-state
    paths:
      - ".github/workflows/workstream-0-harden-audit.yml"

permissions:
  contents: write

jobs:
  harden-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild and validate row-level audit evidence
