name: Verify booking payout workflow

on:
  pull_request:
    paths:
      - "src/app/api/admin/finance/payout/route.ts"
      - "src/components/admin/AdminSalonPayoutAction.tsx"
      - "src/components/admin/AdminSalonPayoutWorkspace.tsx"
      - "src/components/admin/AdminFinanceDashboard.tsx"
      - "supabase/migrations/20260825150000_stripe_connect_booking_payouts.sql"
      - "scripts/verify-booking-payout-workflow.mjs"
      - ".github/workflows/verify-booking-payout-workflow.yml"
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "src/app/api/admin/finance/payout/route.ts"
      - "src/components/admin/AdminSalonPayoutAction.tsx"
      - "src/components/admin/AdminSalonPayoutWorkspace.tsx"
      - "src/components/admin/AdminFinanceDashboard.tsx"
      - "supabase/migrations/20260825150000_stripe_connect_booking_payouts.sql"
      - "scripts/verify-booking-payout-workflow.mjs"
      - ".github/workflows/verify-booking-payout-workflow.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Pull-request builds cannot access protected production secrets. These
      # nonfunctional values only allow Next.js to evaluate the client module.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-booking-payout-workflow.mjs
      - run: npm run verify:migrations
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
