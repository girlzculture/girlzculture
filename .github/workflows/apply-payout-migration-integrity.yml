name: Apply payout migration integrity

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-payout-migration-integrity.mjs"
      - ".github/workflows/apply-payout-migration-integrity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-payout-migration-integrity.mjs
      - name: Commit payout migration integrity
        run: |
          if git diff --quiet; then
            echo "Payout migration integrity is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260825150000_stripe_connect_booking_payouts.sql
          git diff --cached --check
          git commit -m "fix: enforce payout migration integrity"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
