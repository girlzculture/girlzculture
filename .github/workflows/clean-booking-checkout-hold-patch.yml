name: Clean booking checkout hold patch

on:
  workflow_dispatch:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/clean-booking-checkout-hold-patch.mjs"
      - ".github/workflows/clean-booking-checkout-hold-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/clean-booking-checkout-hold-patch.mjs
      - name: Commit checkout hold patch cleanup
        run: |
          if git diff --quiet; then
            echo "Checkout hold patch cleanup is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/admin/bookings/route.ts src/app/api/stripe/booking-checkout/route.ts
          git diff --cached --check
          git commit -m "fix: clean checkout hold patch boundaries"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
