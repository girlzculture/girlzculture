name: Fix PR47 manual booking types

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - name: Apply focused TypeScript corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/AdminManualBookingWizard.tsx')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '      const body = await readApiResponse(response, "Unable to prepare this booking.");',
              '      const body = await readApiResponse(response, "Unable to prepare this booking.") as Row;',
              1,
          )
          text = text.replace(
              '      setResult(body as Row);',
              '      const createdBooking = body.booking && typeof body.booking === "object"\n'
              '        ? body.booking as Row\n'
              '        : null;\n'
              '      setResult(body);',
              1,
          )
          text = text.replace(
              'body.booking?.public_reference',
              'createdBooking?.public_reference',
              1,
          )
          text = text.replace(
              '{ name: selectedSlot.stylistName || selectedSlot.stylist_name }',
              '{ name: String(selectedSlot.stylistName || selectedSlot.stylist_name || "Any available stylist") }',
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "Type corrections are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminManualBookingWizard.tsx
          git commit -m "fix: complete manual booking response typing"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
