name: Fix booking checkout generator escaping

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/fix-booking-checkout-generator-escaping.mjs"
      - ".github/workflows/fix-booking-checkout-generator-escaping.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-booking-checkout-generator-escaping.mjs
      - name: Commit generator escaping correction
        run: |
          if git diff --quiet; then
            echo "Generator escaping correction is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-booking-checkout-hold-safety.mjs
          git diff --cached --check
          git commit -m "fix: escape checkout patch generator templates"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
