name: Apply booking webhook session integrity

on:
  workflow_dispatch:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-booking-webhook-session-integrity.mjs"
      - ".github/workflows/apply-booking-webhook-session-integrity.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-booking-webhook-session-integrity.mjs
      - name: Commit booking webhook session integrity
        run: |
          if git diff --quiet; then
            echo "Booking webhook session integrity is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/stripe/webhook/route.ts
          git diff --cached --check
          git commit -m "fix: bind paid bookings to their Stripe session"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
