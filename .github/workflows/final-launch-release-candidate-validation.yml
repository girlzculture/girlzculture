name: Final launch release candidate validation

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
  pull_request:
    paths:
      - "src/**"
      - "supabase/migrations/**"
      - "scripts/**"
      - "tests/**"
      - "e2e/**"
      - "package.json"
      - "package-lock.json"
      - "playwright*.ts"
      - ".github/workflows/database-migrations.yml"
      - ".github/workflows/final-launch-release-candidate-validation.yml"
  workflow_dispatch:
    inputs:
      billing_sandbox_mode:
        description: Optional protected sandbox verification; never uses production
        type: choice
        required: true
        default: 'off'
        options: ['off', 'read-only', 'setup-cancel']

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: 1
  # Dedicated browser credential; the real provider test fails when it is absent.
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_TEST_BROWSER_KEY }}
  CLEAN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/girlzculture_clean

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["read-only","setup-cancel"]'), inputs.billing_sandbox_mode || 'off') && 'final-launch-billing-sandbox-protected' || format('final-launch-release-candidate-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && contains(fromJSON('["read-only","setup-cancel"]'), inputs.billing_sandbox_mode || 'off')) }}

jobs:
  owner-localization:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.billing_sandbox_mode || 'off') == 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce owner source inventory and locale coverage
        run: npm run verify:owner-localization
      - name: Exercise strict P0 tool, policy, message and launch boundaries
        if: ${{ !cancelled() }}
        run: npm run test:p0:core
      - name: Verify subscription payment-method isolation and no-charge boundary
        if: ${{ !cancelled() }}
        run: node --test tests/subscription-payment-method.test.mjs tests/subscription-payment-explicit.test.mjs tests/subscription-mutation-guard.test.mjs tests/subscription-downgrade.test.mjs scripts/billing-sandbox-success.test.mjs
      - name: Verify isolated business demo scenarios
        if: ${{ !cancelled() }}
        run: node --test tests/business-demo-scenarios.test.mjs

  browser-acceptance:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.billing_sandbox_mode || 'off') == 'off' }}
    runs-on: ubuntu-latest
    # Run 35412096899: shard 3 passed 277 tests in 42m, but setup and artifact
    # upload exceeded the old 45m job envelope. Per-test timeouts stay unchanged.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3105
      NEXT_PUBLIC_SUPABASE_ANON_KEY: acceptance-fixture-anon-key
      SUPABASE_SERVICE_ROLE_KEY: acceptance-fixture-service-role-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3104
      GIRLZ_CULTURE_ACCEPTANCE_MODE: "true"
      NEXT_PUBLIC_ENABLE_ACCEPTANCE_HARNESS: "true"
      CUSTOMER_MARKETPLACE_LIVE: "true"
      PLAYWRIGHT_USE_PRODUCTION_SERVER: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Build with isolated browser fixture configuration
        run: npm run build
      - name: Exercise every browser test across three independent shards
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - name: Upload fixture gallery and browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0-browser-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/screenshots/p0
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  release-candidate:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.billing_sandbox_mode || 'off') == 'off' }}
    needs: [owner-localization, browser-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: girlzculture_clean
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d girlzculture_clean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Close only accidental duplicate PRs created for this exact branch
        if: github.repository == 'girlzculture/girlzculture' && (github.head_ref == 'agent/final-launch-mobile-realtime-admin-corrections' || github.ref_name == 'agent/final-launch-mobile-realtime-admin-corrections')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          branch="agent/final-launch-mobile-realtime-admin-corrections"
          gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${owner}%3A${branch}&per_page=20" \
            --jq '.[] | select(.number != 47 and (.title == "noop" or .title == "DO NOT CREATE" or .title == "Ignore")) | .number' \
            | while read -r number; do
                [ -n "$number" ] || continue
                gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}" \
                  --method PATCH \
                  -f state=closed >/dev/null
              done

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require zero high or critical advisories in the full dependency tree
        run: npm audit --audit-level=high

      - name: Require production dependencies free of moderate-or-higher advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify final completion invariants
        run: npm run verify:final-completion

      - name: Verify migration order
        run: npm run verify:migrations

      - name: Execute the complete migration chain against an empty database
        run: npm run verify:database-clean

      - name: Verify operational monitoring and incident exports
        run: |
          npm run verify:monitoring
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/verify-monitoring-usability.mjs

      - name: Verify final-launch product behavior
        run: |
          node scripts/verify-final-launch-mobile-realtime-admin-corrections.mjs
          node scripts/verify-final-launch-business-workflows.mjs
          node scripts/verify-admin-manual-booking-completion.mjs
          node scripts/verify-booking-checkout-hold-safety.mjs
          node scripts/verify-booking-payout-workflow.mjs
          npm run verify:featured

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build the release candidate
        run: npm run build

      - name: Install browsers for the separate prelaunch server
        run: npx playwright install --with-deps chromium webkit

      - name: Exercise prelaunch routes without a customer launch flag
        run: npm run test:p0:prelaunch

      - name: Upload P0 fixture review gallery
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: p0-review-gallery-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/screenshots/p0
          if-no-files-found: warn
          retention-days: 14

      - name: Upload browser failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: release-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Stripe test-mode connectivity without creating a payment or transfer
        id: stripe
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${STRIPE_SECRET_KEY:-}" ]; then
            echo "status=Not executed: no protected Stripe test secret is configured for this workflow." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *)
              echo "Only an sk_test_ Stripe credential is permitted in release-candidate validation." >&2
              exit 1
              ;;
          esac
          http_code="$({ curl --silent --show-error \
            --output /tmp/stripe-account.json \
            --write-out '%{http_code}' \
            --user "${STRIPE_SECRET_KEY}:" \
            https://api.stripe.com/v1/account; } 2>/tmp/stripe-error.txt)"
          if [ "$http_code" != "200" ]; then
            echo "Stripe test-mode account verification returned HTTP ${http_code}." >&2
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const account = JSON.parse(fs.readFileSync('/tmp/stripe-account.json', 'utf8'));
          if (!String(account.id || '').startsWith('acct_')) {
            throw new Error('Stripe did not return a valid test account identifier.');
          }
          if (account.livemode === true) {
            throw new Error('A live-mode Stripe account must never be used by this validation gate.');
          }
          NODE
          rm -f /tmp/stripe-account.json /tmp/stripe-error.txt
          echo "status=Passed: authenticated read-only Stripe test-mode account connectivity; no payment, charge, payout, or transfer was created." >> "$GITHUB_OUTPUT"

      - name: Record successful verification without replacing the PR description
        if: success()
        env:
          STRIPE_STATUS: ${{ steps.stripe.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release-candidate verification"
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "${STRIPE_STATUS}"
            echo "Production release and migration remain founder-controlled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Leave a failure reference on the existing PR
        if: failure() && github.repository == 'girlzculture/girlzculture'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${{ github.event.pull_request.number }}"
          if [ -z "$pr_number" ]; then
            pr_number="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}%3Aagent%2Ffinal-launch-mobile-realtime-admin-corrections&per_page=20" \
              --jq 'map(select(.number == 47))[0].number // empty')"
          fi
          [ -n "$pr_number" ] || exit 0
          marker='<!-- final-launch-release-candidate-failure -->'
          body="${marker}\nThe authoritative release-candidate gate did not pass for commit \`${GITHUB_SHA}\`. Review the failed step before merging: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments?per_page=100" --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | tail -n 1)"
          if [ -n "$existing" ]; then
            jq -n --arg body "$body" '{body:$body}' \
              | gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --method PATCH --input - >/dev/null
          else
            jq -n --arg body "$body" '{body:$body}' \
              | gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" --method POST --input - >/dev/null
          fi

  billing-sandbox:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["read-only","setup-cancel"]'), inputs.billing_sandbox_mode || 'off') && github.repository == 'girlzculture/girlzculture' }}
    environment: billing-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: girlzculture_clean
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d girlzculture_clean"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without provider credentials
        run: npm ci
      - name: Check sandbox safety gates without provider access
        run: node --test scripts/billing-sandbox-guards.test.mjs scripts/billing-sandbox-success.test.mjs
      - name: Verify the complete schema on an isolated local database
        if: ${{ inputs.billing_sandbox_mode == 'setup-cancel' }}
        env:
          CLEAN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/girlzculture_clean
        run: npm run verify:database-clean
      - name: Exercise actual local attempt RPCs with a simulated provider
        if: ${{ inputs.billing_sandbox_mode == 'setup-cancel' }}
        env:
          BILLING_SANDBOX_TEST_DATABASE: girlzculture_clean
        run: node --test scripts/billing-sandbox-database.test.mjs
      - name: Protected exact-account verification
        env:
          STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
          BILLING_SANDBOX_MODE: ${{ inputs.billing_sandbox_mode }}
          BILLING_SANDBOX_ACCOUNT_ID: ${{ vars.BILLING_SANDBOX_ACCOUNT_ID }}
          BILLING_SANDBOX_CUSTOMER_ID: ${{ vars.BILLING_SANDBOX_CUSTOMER_ID }}
          BILLING_SANDBOX_SUBSCRIPTION_ID: ${{ vars.BILLING_SANDBOX_SUBSCRIPTION_ID }}
          BILLING_SANDBOX_APPROVED_SHA: ${{ vars.BILLING_SANDBOX_APPROVED_SHA }}
          BILLING_SANDBOX_AUTHORIZE_SETUP_CANCEL: ${{ vars.BILLING_SANDBOX_AUTHORIZE_SETUP_CANCEL }}
          BILLING_SANDBOX_EVENT_ROUTING_REVIEWED: ${{ vars.BILLING_SANDBOX_EVENT_ROUTING_REVIEWED }}
          BILLING_SANDBOX_LOCAL_DATABASE: girlzculture_clean
        run: node scripts/verify-billing-sandbox.mjs
      - name: Upload sanitized sandbox verdict only
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: billing-sandbox-${{ github.run_id }}-${{ github.run_attempt }}
          path: billing-sandbox-evidence/report.json
          if-no-files-found: warn
          retention-days: 7
