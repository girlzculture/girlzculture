name: Apply final launch admin wiring

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-final-launch-admin-wiring.mjs"
      - ".github/workflows/apply-final-launch-admin-wiring.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-final-launch-admin-wiring.mjs
      - name: Commit generated wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/owner/OwnerDashboardShell.tsx \
            src/components/admin/AdminRecordWorkspace.tsx \
            src/components/admin/AdminSalonsManager.tsx \
            src/components/admin/AdminSalon360Sections.tsx
          git diff --cached --check
          git commit -m "feat: wire admin activity and Salon 360 workspaces"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
