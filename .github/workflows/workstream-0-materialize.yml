name: Materialize Workstream 0 audit deliverables

on:
  push:
    branches:
      - audit/workstream-0-current-state
    paths:
      - ".audit-payload/**"
      - ".github/workflows/workstream-0-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize and validate the six audit deliverables
        shell: bash
        run: |
          set -euo pipefail
          cat .audit-payload/part00 .audit-payload/part01 .audit-payload/part02 .audit-payload/part03 .audit-payload/part04 > /tmp/workstream-0-audit.tar.xz
          mkdir -p docs/audits/workstream-0
          tar -xJf /tmp/workstream-0-audit.tar.xz -C docs/audits/workstream-0
          python - <<'PY'
          from pathlib import Path
          import csv

          root = Path('docs/audits/workstream-0')
          expected = {
              'CURRENT_STATE_AUDIT.md',
              'FEATURE_GAP_MATRIX.csv',
              'SYSTEM_INVENTORY.md',
              'KNOWN_RISKS.md',
              'IMPLEMENTATION_DEPENDENCIES.md',
              'TEST_ENVIRONMENT_SETUP.md',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'Unexpected audit files: {sorted(actual)}')

          required_columns = [
              'Requirement_ID', 'Workstream', 'Requirement',
              'Affected_User_or_Surface', 'Classification', 'Current_Behavior',
              'Evidence', 'Relevant_Files', 'Relevant_Routes',
              'Relevant_Database_Objects', 'Relevant_Services_or_Endpoints',
              'Relevant_Jobs_or_Events', 'Relevant_Tests', 'Missing_Layers',
              'Security_Privacy_Financial_or_Legal_Risk',
              'Human_Decision_or_Approval_Required', 'External_Dependency',
              'Recommended_Next_Action', 'Suggested_Implementation_Phase',
              'Confidence', 'Verification_Method',
          ]
          allowed = {
              'Complete and correct', 'Complete but weak',
              'Partially implemented', 'Decorative or mocked', 'Duplicated',
              'Missing', 'Unsafe',
          }
          with (root / 'FEATURE_GAP_MATRIX.csv').open(
              newline='', encoding='utf-8-sig'
          ) as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              if reader.fieldnames != required_columns:
                  raise SystemExit('Feature-gap matrix columns do not match the required contract.')
          if len(rows) != 620:
              raise SystemExit(f'Expected 620 matrix rows, found {len(rows)}.')
          ids = [row['Requirement_ID'] for row in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit('Requirement IDs are not unique.')
          if {row['Classification'] for row in rows} != allowed:
              raise SystemExit('Required classification set is incomplete or altered.')
          for index, row in enumerate(rows, start=2):
              for column in required_columns:
                  if not str(row.get(column, '')).strip():
                      raise SystemExit(f'Blank {column} at CSV line {index}.')
          print('Validated six deliverables and 620 evidence-backed matrix rows.')
          PY

      - name: Replace the temporary payload with the final documentation-only diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .audit-payload
          rm -f .github/workflows/workstream-0-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          expected=$(printf '%s\n' \
            docs/audits/workstream-0/CURRENT_STATE_AUDIT.md \
            docs/audits/workstream-0/FEATURE_GAP_MATRIX.csv \
            docs/audits/workstream-0/IMPLEMENTATION_DEPENDENCIES.md \
            docs/audits/workstream-0/KNOWN_RISKS.md \
            docs/audits/workstream-0/SYSTEM_INVENTORY.md \
            docs/audits/workstream-0/TEST_ENVIRONMENT_SETUP.md)
          actual=$(git diff --cached --name-only --diff-filter=AM | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final added/modified files:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git commit -m "docs: complete Workstream 0 current-state audit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
