name: Apply booking check-in exception UI

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-booking-checkin-ui.mjs"
      - ".github/workflows/apply-booking-checkin-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-booking-checkin-ui.mjs
      - name: Commit booking check-in UI wiring
        run: |
          if git diff --quiet; then
            echo "No booking check-in wiring changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/owner/OwnerDashboardApp.tsx
          git diff --cached --check
          git commit -m "feat: add attested early and late check-in workflow"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
