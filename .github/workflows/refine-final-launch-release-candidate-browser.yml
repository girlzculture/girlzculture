name: Refine final launch release candidate browser gate

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refine-final-launch-release-candidate-browser
  cancel-in-progress: false

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use the repository's established browser acceptance commands
        shell: python
        run: |
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/final-launch-release-candidate-validation.yml')
          text = workflow.read_text()
          replacement = r'''      - name: Exercise the authoritative responsive browser workflow
        shell: bash
        run: |
          set -euo pipefail
          source_workflow=".github/workflows/database-migrations.yml"
          if [ ! -f "$source_workflow" ]; then
            echo "The authoritative database/browser workflow is missing." >&2
            exit 1
          fi
          extract_step() {
            local step_name="$1"
            STEP_NAME="$step_name" ruby -ryaml -e '
              document = YAML.load_file(ARGV.fetch(0))
              jobs = document.fetch("jobs")
              step = jobs.values.flat_map { |job| job.fetch("steps", []) }
                .find { |candidate| candidate["name"] == ENV.fetch("STEP_NAME") }
              puts(step && step["run"] ? step["run"] : "")
            ' "$source_workflow"
          }
          for step_name in \
            "Verify route-scoped native media packaging" \
            "Verify production media route cold starts" \
            "Install supported browser engines" \
            "Exercise responsive and affected browser workflows"; do
            command="$(extract_step "$step_name")"
            if [ -z "$command" ]; then
              echo "Authoritative browser step is missing: $step_name" >&2
              exit 1
            fi
            echo "Running authoritative step: $step_name"
            bash -euo pipefail -c "$command"
          done

'''
          pattern = re.compile(
              r'      - name: Exercise responsive browser workflows\n'
              r'[\s\S]*?'
              r'(?=      - name: Require zero high or critical advisories)',
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate the release-candidate browser step.')
          workflow.write_text(updated)

          Path('.github/workflows/refine-final-launch-release-candidate-browser.yml').unlink()

      - name: Commit the permanent browser-gate alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: use authoritative browser acceptance commands"
          git pull --rebase origin agent/final-launch-mobile-realtime-admin-corrections
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections

      - name: Dispatch the authoritative final gate on the consolidated commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run final-launch-release-candidate-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/final-launch-mobile-realtime-admin-corrections
