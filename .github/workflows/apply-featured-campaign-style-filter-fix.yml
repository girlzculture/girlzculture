name: Apply featured campaign style filter fix

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/apply-featured-campaign-style-filter-fix.mjs"
      - ".github/workflows/apply-featured-campaign-style-filter-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-featured-campaign-style-filter-fix.mjs
      - name: Commit generated migration correction
        run: |
          if git diff --quiet; then
            echo "No featured campaign style-filter change was necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260825140000_featured_campaign_owner_controls.sql
          git diff --cached --check
          git commit -m "fix: use archived services in featured discovery"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections