name: Apply safe dependency advisory resolutions

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: safe-dependency-advisory-resolutions
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve advisories without semver-major changes
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=moderate
          rm -f .github/workflows/apply-safe-dependency-advisory-fixes.yml

      - name: Commit the safe lockfile resolution and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: resolve compatible dependency advisories"
            git pull --rebase origin agent/final-launch-mobile-realtime-admin-corrections
            git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
          fi

      - name: Dispatch final release-candidate validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run final-launch-release-candidate-validation.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/final-launch-mobile-realtime-admin-corrections
