name: Apply Featured Salon owner controls

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/templates/featured-campaign-route.ts.txt"
      - "scripts/templates/AdminFeaturedCampaignsV2.tsx.txt"
      - "scripts/apply-featured-campaign-owner-controls.mjs"
      - ".github/workflows/apply-featured-campaign-owner-controls.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-featured-campaign-owner-controls.mjs
      - name: Commit focused Featured Salon controls
        run: |
          if git diff --quiet; then
            echo "Featured Salon controls are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/admin/featured-campaigns/route.ts \
            src/components/admin/AdminFeaturedCampaigns.tsx \
            src/lib/marketingEntitlements.ts \
            supabase/migrations/20260825140000_featured_campaign_owner_controls.sql
          git diff --cached --check
          git commit -m "feat: complete Featured Salon campaign controls"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
