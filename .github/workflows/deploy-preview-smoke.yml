name: Verify Netlify deploy preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: girlz-culture-deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--girlzculture.netlify.app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the actual Netlify Deploy Preview
        run: node scripts/verify-deploy-preview.mjs
      - name: Upload deploy-preview screenshots and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: deploy-preview-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/deploy-preview
          if-no-files-found: warn
          retention-days: 14
