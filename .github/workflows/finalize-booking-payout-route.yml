name: Finalize booking payout route

on:
  push:
    branches:
      - agent/final-launch-mobile-realtime-admin-corrections
    paths:
      - "scripts/finalize-booking-payout-route.mjs"
      - ".github/workflows/finalize-booking-payout-route.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-launch-mobile-realtime-admin-corrections
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/finalize-booking-payout-route.mjs
      - name: Commit payout route compatibility
        run: |
          if git diff --quiet; then
            echo "No payout route compatibility changes were necessary."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/admin/finance/booking-payout/route.ts
          git diff --cached --check
          git commit -m "fix: finalize payout route compatibility"
          git push origin HEAD:agent/final-launch-mobile-realtime-admin-corrections
